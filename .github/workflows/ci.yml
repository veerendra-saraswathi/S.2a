name: Gate 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tooling/check_headers.py
      - run: python -m unittest discover -s tests -v
      - run: python tooling/s2.py --db .local/ci-demo.db demo

  file-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-storage.lock
      - run: python tooling/check_headers.py
      - run: S2_REQUIRE_STORAGE_TESTS=1 python -m unittest discover -s tests -v
      - run: python tooling/s2.py --db .local/iceberg-ci.db --storage iceberg demo
      - run: python tooling/s2.py --db .local/iceberg-ci.db storage-report
